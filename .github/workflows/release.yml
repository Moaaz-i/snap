name: Build and Release Windows Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.4)'
        required: true
        default: 'v1.0.4'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Compile snap.exe and launcher.exe
        shell: bash
        env:
          CID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CSEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/ProgramData/mingw64/mingw64/bin:$PATH"
          command -v g++ && g++ --version | head -n 1

          windres app.rc -O coff -o app.res

          g++ -O2 -std=c++17 -static -static-libgcc -static-libstdc++ \
            -DSNAP_VERSION="\"${{ steps.ver.outputs.version }}\"" \
            -DDEFAULT_CLIENT_ID="\"${CID}\"" \
            -DDEFAULT_CLIENT_SECRET="\"${CSEC}\"" \
            windows_snap.cpp app.res -o snap.exe \
            -ld3d11 -ldxgi -lgdiplus -lgdi32 -luser32 -ladvapi32 -lwinhttp -lws2_32 -lcrypt32 -lshell32 -lole32

          g++ -O2 -std=c++17 -mwindows -static -static-libgcc -static-libstdc++ \
            launcher.cpp app.res -o launcher.exe \
            -lwinhttp -ladvapi32 -luser32

          windres installer.rc -O coff -o installer.res
          g++ -O2 -std=c++17 -static -static-libgcc -static-libstdc++ \
            -DSNAP_VERSION="\"${{ steps.ver.outputs.version }}\"" \
            installer.cpp installer.res -o SnapInstaller.exe \
            -ladvapi32 -luser32

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            SnapInstaller.exe
            snap.exe
            launcher.exe
